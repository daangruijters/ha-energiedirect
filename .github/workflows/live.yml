name: Live check

# Checks Energiedirect's live APIs as far as possible without logging in (see
# scripts/check_live.py). Separate from "Validate" so an Energiedirect outage never fails a
# code change. A failing scheduled run opens an issue; the next passing run closes it.

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/check_live.py
      - custom_components/energiedirect/api.py
      - custom_components/energiedirect/parsers.py
      - .github/workflows/live.yml

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install aiohttp tzdata
      - id: check
        run: python scripts/check_live.py

      - name: Open or update an issue
        if: failure() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create live-check --color B60205 --description "Daily live API check failed" --force
          number=$(gh issue list --label live-check --state open --json number -q '.[0].number')
          body="The daily live check against Energiedirect failed: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "Live check failed: Energiedirect API may have changed" \
              --label live-check --body "$body"
          fi

      - name: Close a resolved issue
        if: success() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for number in $(gh issue list --label live-check --state open --json number -q '.[].number'); do
            gh issue close "$number" --comment "The live check passes again: $RUN_URL"
          done
